name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify tag and package version
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run test:git-install
      - name: Build release assets
        run: |
          npm pack --json > pack.json
          package_file=$(node -e "const fs=require('fs'); console.log(JSON.parse(fs.readFileSync('pack.json','utf8'))[0].filename)")
          sha256sum "$package_file" > SHA256SUMS
          printf '%s\n' "$package_file" > package-file.txt
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "$(cat package-file.txt)" SHA256SUMS --draft --verify-tag --title "$GITHUB_REF_NAME"
